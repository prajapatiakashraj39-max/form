<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 575px;
            margin: 10px auto;
            padding: 35px 37px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px #aaa;
        }

        h1 {
            text-align: center;
            color: #202d3a;
            font-size: 40px;
            margin: 30px 0 25px;
        }

        label {
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin: 16px 0 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            height: 48px;
            padding: 10px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .gender {
            font-size: 20px;
            font-weight: normal;
        }

        .gender input {
            margin-left: 5px;
            margin-right: 5px;
        }

        .terms {
            font-size: 20px;
            font-weight: normal;
            margin-top: 20px;
        }

        .terms input {
            width: 17px;
            height: 17px;
            margin-right: 8px;
        }

        button {
            width: 100%;
            height: 53px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #4caf50;
            color: white;
            font-size: 21px;
            cursor: pointer;
        }

        button:hover {
            background: #43a047;
        }
    </style> 
</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>

        <form>

            <label>Name:</label>
            <input type="text" placeholder="Enter your name">

            <label>Email:</label>
            <input type="email" placeholder="Enter your email">

            <label>Password:</label>
            <input type="password" placeholder="Enter your password">

            <label>Gender:</label>
            <div class="gender">
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
                <input type="radio" name="gender"> Other
            </div>

            <label>Department:</label>
            <select>
                <option>Select Department</option>
                <option>Computer Science and Engineering</option>
                <option>Information Technology</option>
                <option>Mechanical Engineering</option>
                <option>Civil Engineering</option>
                <option>Electrical Engineering</option>
                <option>Electronics Engineering</option>
                <option>Mathematics and Computing</option>
            </select>

            <div class="terms">
                <input type="checkbox">
                I agree to the Terms and Conditions
            </div>

            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
